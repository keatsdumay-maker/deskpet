<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
.container{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:4px}
.bubble{position:absolute;top:2px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid #333;padding:3px 6px;font-size:10px;font-family:sans-serif;white-space:nowrap;opacity:0;transition:opacity .2s;border-radius:2px;z-index:10}
.bubble.show{opacity:1}
.bubble::after{content:'';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:4px solid #333}
.crab{position:relative;display:flex;flex-direction:column;align-items:center}
.body-row{display:flex;align-items:center}
.hand{width:6px;height:4px;background:#E8A088}
.body{width:40px;height:32px;background:#E8A088;position:relative}
.eye{position:absolute;width:5px;height:10px;background:#111;top:10px}
.eye.left{left:10px}
.eye.right{right:10px}
.legs{display:flex;justify-content:center;gap:4px}
.leg{width:5px;height:6px;background:#E8A088}
.shadow{width:32px;height:4px;background:rgba(0,0,0,.12);margin-top:1px;border-radius:1px}
.accessory{position:absolute;top:-8px;left:50%;transform:translateX(-50%)}
@keyframes idle-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes leg-step{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.7)}}
.crab.idle{animation:idle-float 2s ease-in-out infinite}
.crab.idle .leg:nth-child(odd){animation:leg-step 1s ease-in-out infinite}
.crab.idle .leg:nth-child(even){animation:leg-step 1s ease-in-out .5s infinite}
.crab.happy .eye{height:4px;top:13px}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}60%{transform:translateY(-3px)}}
.crab.happy{animation:bounce .5s ease 2}
.crab.sleepy .eye{height:2px;top:15px;background:#666}
.zzz{position:absolute;top:-10px;right:-4px;font-size:8px;opacity:0}
.crab.sleepy .zzz{opacity:1;animation:float-up 2s ease-in-out infinite}
@keyframes float-up{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-6px);opacity:0}}
.crab.angry .body{background:#D4796A}
.angry-mark{position:absolute;top:-6px;right:0;font-size:8px;opacity:0}
.crab.angry .angry-mark{opacity:1}
@keyframes walk-move{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
.crab.walk{animation:walk-move .4s ease-in-out infinite}
.crab.walk .leg{animation:leg-step .2s ease-in-out infinite}
.blush{position:absolute;width:6px;height:4px;background:rgba(255,100,100,.5);top:18px;display:none}
.blush.left{left:4px}
.blush.right{right:4px}
.crab.shy .blush{display:block}
.crab.shy{transform:scale(.9)}
.crab.shy .hand{display:none}
.star{position:absolute;top:-8px;font-size:8px;opacity:0}
.crab.sparkle .star{opacity:1;animation:twinkle 1s ease infinite}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}
</style>
</head>
<body>
<div class="container">
<div class="bubble" id="bubble"></div>
<div class="crab idle" id="crab">
<div class="star" id="star">✦</div>
<div class="zzz">Z</div>
<div class="angry-mark">!</div>
<div class="accessory" id="accessory"></div>
<div class="body-row">
<div class="hand"></div>
<div class="body">
<div class="eye left"></div>
<div class="eye right"></div>
<div class="blush left"></div>
<div class="blush right"></div>
</div>
<div class="hand"></div>
</div>
<div class="legs">
<div class="leg"></div>
<div class="leg"></div>
<div class="leg"></div>
<div class="leg"></div>
</div>
</div>
<div class="shadow"></div>
</div>
<script>
const crab=document.getElementById('crab');
const bubble=document.getElementById('bubble');
let currentState='idle';
let stateTimer=null;
let accessoryIndex=0;
const accessories=['none','hardhat','headphones','glasses','bow'];

function setState(s){
crab.className='crab '+s;
currentState=s;
}

function showBubble(t){
bubble.textContent=t;
bubble.classList.add('show');
if(stateTimer)clearTimeout(stateTimer);
stateTimer=setTimeout(()=>{bubble.classList.remove('show')},2000);
}

function rp(a){return a[Math.floor(Math.random()*a.length)]}

function autoReturn(ms){
setTimeout(()=>{setState('idle')},ms);
}

function setAccessory(type){
const acc=document.getElementById('accessory');
acc.innerHTML='';
if(type==='hardhat')acc.innerHTML='<div style="width:20px;height:5px;background:#FFD700;margin:0 auto"></div>';
else if(type==='headphones')acc.innerHTML='<div style="width:30px;height:3px;background:#333;border-radius:8px 8px 0 0;margin:0 auto"></div>';
else if(type==='glasses')acc.innerHTML='<div style="display:flex;gap:2px;justify-content:center"><div style="width:8px;height:6px;border:1.5px solid #333"></div><div style="width:8px;height:6px;border:1.5px solid #333"></div></div>';
else if(type==='bow')acc.innerHTML='<div style="width:0;height:0;border-left:5px solid #FF69B4;border-right:5px solid #FF69B4;border-top:3px solid transparent;border-bottom:3px solid transparent;margin:0 auto"></div>';
}

class PetEngine{
onTap(){
showBubble(rp(['别戳了！','干嘛！','哎呀','嗯？','戳戳戳']));
autoReturn(2000);
}
onDoubleTap(){
setState('happy');
showBubble(rp(['嘿嘿♥','开心！','喜欢你~','哇!']));
autoReturn(3000);
}
onLongPress(){
accessoryIndex=(accessoryIndex+1)%accessories.length;
setAccessory(accessories[accessoryIndex]);
showBubble(accessories[accessoryIndex]==='none'?'脱掉了~':'好看吗？');
}
setMood(m){setState(m);autoReturn(5000)}
}
window.petEngine=new PetEngine();
</script>
</body>
</html>
