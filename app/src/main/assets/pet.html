<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; }
html, body { 
  background: transparent; 
  overflow: hidden;
  width: 100%; 
  height: 100%;
}
canvas { 
  image-rendering: pixelated; 
  image-rendering: crisp-edges;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
</style>
</head>
<body>
<canvas id="crab"></canvas>
<script>
const canvas = document.getElementById('crab');
const ctx = canvas.getContext('2d');

const PX = 4;
const W = 40;
const H = 32;

canvas.width = W * PX;
canvas.height = H * PX;

const BODY_COLOR = '#E8926A';
const EYE_COLOR = '#2D2D2D';
const SHADOW_COLOR = 'rgba(0,0,0,0.25)';

function drawPixel(x, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * PX, y * PX, PX, PX);
}

function drawRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * PX, y * PX, w * PX, h * PX);
}

let frame = 0;
let bobOffset = 0;

function drawCrab(time) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  const bobCycle = Math.sin(time / 400) * 1;
  const bob = Math.round(bobCycle);
  
  const legPhase = Math.floor(time / 300) % 2;
  
  ctx.fillStyle = SHADOW_COLOR;
  ctx.fillRect(10 * PX, 28 * PX, 20 * PX, 2 * PX);
  
  const leg1Offset = legPhase === 0 ? 0 : 1;
  const leg2Offset = legPhase === 0 ? 1 : 0;
  
  drawRect(13, 23 + bob + leg1Offset, 2, 5 - leg1Offset, BODY_COLOR);
  drawRect(17, 23 + bob + leg2Offset, 2, 5 - leg2Offset, BODY_COLOR);
  drawRect(21, 23 + bob + leg2Offset, 2, 5 - leg2Offset, BODY_COLOR);
  drawRect(25, 23 + bob + leg1Offset, 2, 5 - leg1Offset, BODY_COLOR);
  
  drawRect(10, 8 + bob, 20, 16, BODY_COLOR);
  
  drawRect(6, 14 + bob, 4, 3, BODY_COLOR);
  drawRect(30, 14 + bob, 4, 3, BODY_COLOR);
  
  drawRect(16, 12 + bob, 2, 5, EYE_COLOR);
  drawRect(22, 12 + bob, 2, 5, EYE_COLOR);
  drawPixel(16, 12 + bob, '#FFFFFF');
  drawPixel(22, 12 + bob, '#FFFFFF');
}

function animate(time) {
  drawCrab(time);
  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
