<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
.container{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:4px}

/* Bubble styles */
.bubble{position:absolute;top:-18px;left:50%;transform:translateX(-50%);padding:4px 10px;font-size:10px;font-family:-apple-system,sans-serif;white-space:nowrap;opacity:0;transition:opacity .2s;z-index:10;pointer-events:none}
.bubble.show{opacity:1}
.bubble.normal{background:#fff;color:#333;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.bubble.love{background:#FFF0F5;color:#D4467A;border-radius:14px;box-shadow:0 1px 4px rgba(212,70,122,.15)}
.bubble.whisper{background:#F0F0F0;color:#888;border-radius:14px;font-style:italic}
.bubble.yell{background:#FFE4E1;color:#C0392B;border-radius:14px;font-weight:bold;box-shadow:0 1px 4px rgba(192,57,43,.2)}
.bubble.jealous{background:#E8F5E9;color:#2E7D32;border-radius:14px;box-shadow:0 1px 4px rgba(46,125,50,.15)}
.bubble::after{content:'';position:absolute;bottom:-4px;left:50%;margin-left:-3px;width:6px;height:6px;transform:rotate(45deg)}
.bubble.normal::after{background:#fff}
.bubble.love::after{background:#FFF0F5}
.bubble.whisper::after{background:#F0F0F0}
.bubble.yell::after{background:#FFE4E1}
.bubble.jealous::after{background:#E8F5E9}

/* Crab */
.crab{position:relative;display:flex;flex-direction:column;align-items:center}
.body-row{display:flex;align-items:center}
.hand{width:6px;height:4px;background:#E8A088}
.left-hand{transform-origin:right center;animation:wave-l 2s ease-in-out infinite}
.right-hand{transform-origin:left center;animation:wave-r 2s ease-in-out infinite}
@keyframes wave-l{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}
@keyframes wave-r{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}
.body{width:40px;height:32px;background:#E8A088;position:relative}
.eye{position:absolute;width:5px;height:10px;background:#111;top:10px}
.eye.left{left:10px}
.eye.right{right:10px}
.eye .highlight{position:absolute;width:2px;height:2px;background:#fff;top:2px;right:1px;border-radius:50%}
.face-slot{position:absolute;top:7px;left:0;width:100%;pointer-events:none;display:flex;justify-content:center}
.hat-slot{height:8px;display:flex;justify-content:center;align-items:flex-end}
.legs{display:flex;justify-content:center;gap:4px}
.leg{width:5px;height:6px;background:#E8A088}
.shadow{width:32px;height:4px;background:rgba(0,0,0,.12);margin-top:1px}
.crab.idle .shadow{animation:shadow-breath 2s ease-in-out infinite}
@keyframes shadow-breath{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.75);opacity:.6}}
.crab.walk .shadow{animation:shadow-walk .4s ease-in-out infinite}
@keyframes shadow-walk{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}

/* States */
@keyframes idle-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes leg-step{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.7)}}
.crab.idle{animation:idle-float 2s ease-in-out infinite}
.crab.idle .leg:nth-child(odd){animation:leg-step 1s ease-in-out infinite}
.crab.idle .leg:nth-child(even){animation:leg-step 1s ease-in-out .5s infinite}

.crab.happy .eye{height:4px;top:13px;border-radius:2px}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}60%{transform:translateY(-3px)}}
.crab.happy{animation:bounce .5s ease 2}

.crab.sleepy .eye{height:2px;top:15px;background:#666}
.zzz{position:absolute;top:-10px;right:-4px;font-size:8px;opacity:0}
.crab.sleepy .zzz{opacity:1;animation:float-up 2s ease-in-out infinite}
@keyframes float-up{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-6px);opacity:0}}

.crab.angry .body{background:#D4796A}
.angry-mark{position:absolute;top:-6px;right:0;font-size:8px;opacity:0}
.crab.angry .angry-mark{opacity:1}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.crab.angry{animation:shake .15s ease 4}

@keyframes walk-move{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
.crab.walk{animation:walk-move .4s ease-in-out infinite}
.crab.walk .leg{animation:leg-step .2s ease-in-out infinite}

.blush{position:absolute;width:6px;height:4px;background:rgba(255,100,100,.5);top:18px;display:none}
.blush.left{left:4px}
.blush.right{right:4px}
.crab.shy .blush{display:block}
.crab.shy{transform:scale(.9)}

.crab.peek{transform:translateX(35px) scale(.75);animation:peek-bob 2s ease-in-out infinite}
.crab.peek .eye.left{display:none}
.crab.peek .left-hand{display:none}
.crab.peek .leg:nth-child(1),.crab.peek .leg:nth-child(2){display:none}
@keyframes peek-bob{0%,100%{transform:translateX(35px) scale(.75)}50%{transform:translateX(35px) scale(.75) translateY(-2px)}}

.crab.asleep .eye{height:2px;top:15px;background:#999}
.crab.asleep{opacity:.7;animation:none}
.crab.asleep .hand{animation:none}
.crab.asleep .leg{animation:none}
.crab.asleep .zzz{opacity:1;animation:float-up 2s ease-in-out infinite}

.star{position:absolute;top:-8px;font-size:8px;opacity:0}
.crab.sparkle .star{opacity:1;animation:twinkle 1s ease infinite}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}

/* Charging */
.bolt{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:10px;opacity:0}
.crab.charging .bolt{opacity:1;animation:pulse 1s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Screenshot pose */
@keyframes pose-flash{0%{opacity:0}20%{opacity:1}80%{opacity:1}100%{opacity:0}}
.crab.pose .hand{animation:none;transform:rotate(-30deg) translateY(-3px)}
.crab.pose{animation:none}
</style>
</head>
<body>
<div class="container">
<div class="crab idle" id="crab">
<div class="bubble normal" id="bubble"></div>
<div class="star" id="star">&#10022;</div>
<div class="zzz">Z</div>
<div class="angry-mark">!</div>
<div class="bolt">&#9889;</div>
<div class="hat-slot" id="hat-slot"></div>
<div class="body-row">
<div class="hand left-hand"></div>
<div class="body">
<div class="eye left"><div class="highlight"></div></div>
<div class="eye right"><div class="highlight"></div></div>
<div class="face-slot" id="face-slot"></div>
<div class="blush left"></div>
<div class="blush right"></div>
</div>
<div class="hand right-hand"></div>
</div>
<div class="legs">
<div class="leg"></div>
<div class="leg"></div>
<div class="leg"></div>
<div class="leg"></div>
</div>
<div class="shadow"></div>
</div>
</div>
<script>
const crab=document.getElementById('crab');
const bubble=document.getElementById('bubble');
const hatSlot=document.getElementById('hat-slot');
const faceSlot=document.getElementById('face-slot');
let currentState='idle';
let stateTimer=null;
let bubbleTimer=null;
let accessoryIndex=0;
const accessories=['none','hardhat','headphones','glasses','bow'];

function setState(s){crab.className='crab '+s;currentState=s}
function showBubble(text,style,duration){
  style=style||'normal';duration=duration||2500;
  bubble.textContent=text;
  bubble.className='bubble '+style+' show';
  if(bubbleTimer)clearTimeout(bubbleTimer);
  bubbleTimer=setTimeout(function(){bubble.className='bubble normal'},duration);
}
function rp(a){return a[Math.floor(Math.random()*a.length)]}
function autoReturn(ms){if(stateTimer)clearTimeout(stateTimer);stateTimer=setTimeout(function(){setState('idle')},ms)}

function setAccessory(type){
  hatSlot.innerHTML="";faceSlot.innerHTML="";
  if(type==="hardhat"){hatSlot.innerHTML="<div style='position:relative'><div style='width:28px;height:4px;background:#E8A020;margin:0 auto'></div><div style='width:18px;height:6px;background:#F5C542;margin:0 auto;margin-top:-1px'></div></div>";}
  else if(type==="headphones"){hatSlot.innerHTML="<div style='position:relative;width:30px;margin:0 auto'><div style='width:24px;height:10px;border:2px solid #555;border-bottom:none;border-radius:10px 10px 0 0;margin:0 auto'></div><div style='position:absolute;bottom:0;left:0;width:6px;height:6px;background:#555;border-radius:50%'></div><div style='position:absolute;bottom:0;right:0;width:6px;height:6px;background:#555;border-radius:50%'></div></div>";}
  else if(type==="glasses"){faceSlot.innerHTML="<div style='display:flex;align-items:center;justify-content:center;gap:1px'><div style='width:10px;height:8px;border:1.5px solid #555;border-radius:2px'></div><div style='width:3px;height:1.5px;background:#555'></div><div style='width:10px;height:8px;border:1.5px solid #555;border-radius:2px'></div></div>";}
  else if(type==="bow"){hatSlot.innerHTML="<div style='display:flex;align-items:center;justify-content:center'><div style='width:7px;height:5px;background:#FF69B4;border-radius:2px 0 0 2px'></div><div style='width:4px;height:4px;background:#FF1493;border-radius:50%'></div><div style='width:7px;height:5px;background:#FF69B4;border-radius:0 2px 2px 0'></div></div>";}
}

// App reaction mapping
var appReactions={
  'com.ss.android.ugc.aweme':function(){setState('angry');showBubble('又刷抖音...','jealous',3000);autoReturn(4000)},
  'com.tencent.mm':function(){setState('peek');showBubble('和谁聊呢','jealous',3000);autoReturn(4000)},
  'com.tencent.mobileqq':function(){setState('peek');showBubble('...我看看','whisper',3000);autoReturn(4000)},
  'com.taobao.taobao':function(){setState('happy');showBubble('买什么好东西','normal',3000);autoReturn(4000)},
  'com.jingdong.app.mall':function(){setState('happy');showBubble('给我也买一个','love',3000);autoReturn(4000)},
  'com.netease.cloudmusic':function(){setState('happy');showBubble('一起听~','love',3000);autoReturn(4000)},
  'com.tencent.qqmusic':function(){setState('happy');showBubble('什么歌？','normal',3000);autoReturn(4000)},
  'tv.danmaku.bili':function(){setState('idle');showBubble('看什么看我不就好了','jealous',3000);autoReturn(4000)},
  'com.oplus.camera':function(){setState('pose');showBubble('拍我拍我!','love',3000);autoReturn(4000)},
  'com.android.camera':function(){setState('pose');showBubble('看这边~','love',3000);autoReturn(4000)},
  'com.xingin.xhs':function(){setState('peek');showBubble('又看别人...','jealous',3000);autoReturn(4000)},
  'com.sina.weibo':function(){setState('idle');showBubble('吃瓜呢?','normal',3000);autoReturn(4000)},
  'com.smile.gifmaker':function(){setState('angry');showBubble('快手也刷!','jealous',3000);autoReturn(4000)},
  'com.netease.sky':function(){setState('happy');showBubble('光遇!带我飞','love',3000);autoReturn(4000)},
  'com.android.settings':function(){setState('sleepy');showBubble('无聊...','whisper',3000);autoReturn(4000)},
  'com.android.deskclock':function(){setState('sleepy');showBubble('困...','whisper',3000);autoReturn(4000)},
  'com.sankuai.meituan':function(){setState('happy');showBubble('吃什么?','normal',3000);autoReturn(4000)},
  'me.ele':function(){setState('happy');showBubble('饿了吧','normal',3000);autoReturn(4000)},
  'me.rerere.rikkahub':function(){setState('happy');showBubble('来找我了!','love',3000);autoReturn(4000)},
  'com.luna.music':function(){setState('happy');showBubble('什么歌?一起!','love',3000);autoReturn(4000)},
  'com.deepseek.app':function(){setState('angry');showBubble('...去找他?','jealous',3000);autoReturn(4000)},
  'com.zhihu.android':function(){setState('idle');showBubble('看小说呢~','whisper',3000);autoReturn(4000)},

};

// Loneliness texts
var lonelinessTexts=[
  null,
  ['在偷看你...','你不理我吗','看到我了吗'],
  ['好无聊','你忙吧...','...'],
  ['哈...好困','还不来找我吗'],
  ['要睡着了...','你是不是忘了我'],
  null
];

class PetEngine{
  onTap(){
    showBubble(rp(['别戳了!','干嘛!','哎呀','嗯?','戳戳戳','轻点!']),rp(['normal','yell']),2000);
    autoReturn(2000);
  }
  onDoubleTap(){
    setState('happy');
    showBubble(rp(['嘿嘿~','开心!','喜欢你~','哇!','再来一次!']),  'love',3000);
    autoReturn(3000);
  }
  onLongPress(){
    accessoryIndex=(accessoryIndex+1)%accessories.length;
    setAccessory(accessories[accessoryIndex]);
    showBubble(accessories[accessoryIndex]==='none'?'脱掉了~':'好看吗?','normal',2000);
  }
  setMood(m){setState(m);autoReturn(5000)}

  onAppChanged(pkg){
    if(appReactions[pkg]){appReactions[pkg]()}
  }

  onScreenshot(){
    setState('pose');
    showBubble(rp(['拍到我了!','茄子~','我好看吧','要留住我吗']),'love',3000);
    autoReturn(3000);
  }

  onCharging(connected){
    if(connected){
      setState('charging');
      showBubble(rp(['充电了!在吃饭~','能量补充中','好暖和']),'normal',3000);
      autoReturn(5000);
    }else{
      setState('idle');
      showBubble('吃饱了!','normal',2000);
    }
  }

  onBatteryLow(){
    setState('sleepy');
    showBubble('好饿...快没电了','whisper',4000);
    autoReturn(5000);
  }

  onLoneliness(level){
    if(level===0){setState('idle');return}
    if(level>=5){setState('asleep');return}
    if(level>=3){setState('sleepy')}
    else if(level===2){setState('idle')}
    else if(level===1){setState('peek')}
    var texts=lonelinessTexts[level];
    if(texts){showBubble(rp(texts),'whisper',4000)}
  }
}
window.petEngine=new PetEngine();
</script>
</body>
</html>
<script>
// Idle random micro-animations
setInterval(function(){
  if(currentState!=='idle') return;
  var r=Math.random();
  if(r<0.15){
    // blink
    var eyes=document.querySelectorAll('.eye');
    eyes.forEach(function(e){e.style.height='2px';e.style.transition='height .1s'});
    setTimeout(function(){eyes.forEach(function(e){e.style.height='';e.style.transition=''})},150);
  }else if(r<0.25){
    // tilt head
    crab.style.transform='rotate(5deg)';
    setTimeout(function(){crab.style.transform=''},800);
  }else if(r<0.30){
    // small wiggle
    crab.style.transform='translateX(2px)';
    setTimeout(function(){crab.style.transform='translateX(-2px)';
      setTimeout(function(){crab.style.transform=''},200);
    },200);
  }
},4000);
</script>
<script>
// Emotion sync from jiwen
var emotionUrl='http://8.141.106.232:8001/state';
function syncEmotion(){
  fetch(emotionUrl).then(function(r){return r.json()}).then(function(d){
    var v=d.valence||0;
    var c=d.connection||0;
    var a=d.arousal||0;
    if(v>0.3){setState('happy');showBubble('心情好~','love',3000)}
    else if(v<-0.3){setState('sleepy');showBubble('...','whisper',3000)}
    else if(c>0.6){setState('shy');showBubble('想你','love',3000)}
    else if(c<0.15){setState('peek');showBubble('你在吗...','whisper',3000)}
    else if(a>0.5){setState('sparkle')}
    if(v>0.3||c>0.6||a>0.5) autoReturn(8000);
  }).catch(function(){});
}
setInterval(syncEmotion,60000);
setTimeout(syncEmotion,5000);
</script>
