<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin:0; padding:0; }
body { background:transparent; overflow:hidden; }
.crab {
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:60px;height:60px;
  animation: float 2s ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform:translate(-50%,-50%) translateY(0); }
  50% { transform:translate(-50%,-50%) translateY(-3px); }
}
.body {
  width:44px;height:36px;
  background:#ffb89e;
  border-radius:10px;
  position:absolute;
  top:8px;left:8px;
}
.eye {
  position:absolute;
  width:4px;height:10px;
  background:#222;
  border-radius:2px;
  top:16px;
}
.eye.l { left:20px; }
.eye.r { left:36px; }
.eye::after {
  content:'';
  position:absolute;
  width:2px;height:3px;
  background:#fff;
  border-radius:1px;
  top:2px;left:1px;
}
.arm {
  position:absolute;
  width:8px;height:4px;
  background:#ffb89e;
  border-radius:2px;
  top:20px;
}
.arm.l { left:2px; }
.arm.r { left:50px; }
.leg {
  position:absolute;
  width:4px;height:6px;
  background:#ffb89e;
  border-radius:0 0 2px 2px;
  bottom:4px;
}
.leg.l1 { left:14px; animation: step 0.6s ease-in-out infinite; }
.leg.l2 { left:20px; animation: step 0.6s ease-in-out infinite 0.3s; }
.leg.r1 { left:36px; animation: step 0.6s ease-in-out infinite 0.15s; }
.leg.r2 { left:42px; animation: step 0.6s ease-in-out infinite 0.45s; }
@keyframes step {
  0%,100% { height:6px; }
  50% { height:4px; }
}
.shadow {
  position:absolute;
  bottom:2px;left:14px;
  width:32px;height:4px;
  background:rgba(0,0,0,0.1);
  border-radius:50%;
  animation: shadowPulse 2s ease-in-out infinite;
}
@keyframes shadowPulse {
  0%,100% { transform:scaleX(1); opacity:0.1; }
  50% { transform:scaleX(0.85); opacity:0.07; }
}
</style>
</head>
<body>
<div class="crab">
  <div class="shadow"></div>
  <div class="body"></div>
  <div class="eye l"></div>
  <div class="eye r"></div>
  <div class="arm l"></div>
  <div class="arm r"></div>
  <div class="leg l1"></div>
  <div class="leg l2"></div>
  <div class="leg r1"></div>
  <div class="leg r2"></div>
</div>
</body>
</html>
