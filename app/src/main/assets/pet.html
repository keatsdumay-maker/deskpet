<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; }
html, body { background: transparent; overflow: hidden; }
#pet { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); }
#bubble { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: #fff; border-radius: 12px; padding: 6px 12px; font-size: 12px; white-space: nowrap; display: none; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
</style>
</head>
<body>
<div id="bubble"></div>
<svg id="pet" width="80" height="80" viewBox="0 0 16 16">
<rect x="3" y="4" width="10" height="8" fill="#E8825A"/>
<rect x="2" y="5" width="1" height="6" fill="#E8825A"/>
<rect x="13" y="5" width="1" height="6" fill="#E8825A"/>
<rect x="5" y="6" width="1" height="3" fill="#1a1a1a"/>
<rect x="10" y="6" width="1" height="3" fill="#1a1a1a"/>
<rect x="7" y="10" width="2" height="1" fill="#1a1a1a"/>
<rect x="4" y="12" width="2" height="2" fill="#1a1a1a"/>
<rect x="10" y="12" width="2" height="2" fill="#1a1a1a"/>
</svg>
<script>
var petEngine = {
  el: document.getElementById('pet'),
  bubble: document.getElementById('bubble'),
  onTap: function() {
    this.showBubble('?');
    this.bounce();
  },
  onDoubleTap: function() {
    this.showBubble('!!');
  },
  onLongPress: function() {
    this.showBubble('...');
  },
  showBubble: function(text) {
    this.bubble.textContent = text;
    this.bubble.style.display = 'block';
    var self = this;
    setTimeout(function() { self.bubble.style.display = 'none'; }, 3000);
  },
  bounce: function() {
    this.el.style.transition = 'transform 0.1s';
    this.el.style.transform = 'translateX(-50%) translateY(-8px)';
    var self = this;
    setTimeout(function() {
      self.el.style.transform = 'translateX(-50%) translateY(0)';
    }, 100);
  }
};
window.petEngine = petEngine;
</script>
</body>
</html>
