<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; }
html, body { 
  background: transparent; 
  overflow: hidden;
  width: 100%; 
  height: 100%;
}
canvas { 
  image-rendering: pixelated; 
  image-rendering: crisp-edges;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
</style>
</head>
<body>
<canvas id="crab"></canvas>
<script>
const canvas = document.getElementById('crab');
const ctx = canvas.getContext('2d');

const PX = 4;
const W = 32;
const H = 24;

canvas.width = W * PX;
canvas.height = H * PX;

const BODY = '#E8926A';
const EYE = '#2D2D2D';
const SHADOW = 'rgba(0,0,0,0.18)';

function px(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * PX, y * PX, w * PX, h * PX);
}

function drawCrab(time) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  const bob = Math.round(Math.sin(time / 500) * 0.8);
  const legPhase = Math.floor(time / 350) % 2;
  
  px(7, 21, 18, 2, SHADOW);
  
  const l1 = legPhase === 0 ? 0 : 1;
  const l2 = legPhase === 0 ? 1 : 0;
  
  px(10, 17 + bob + l1, 2, 3 - l1, BODY);
  px(14, 17 + bob + l2, 2, 3 - l2, BODY);
  px(18, 17 + bob + l2, 2, 3 - l2, BODY);
  px(22, 17 + bob + l1, 2, 3 - l1, BODY);
  
  px(7, 6 + bob, 18, 12, BODY);
  
  px(4, 10 + bob, 3, 2, BODY);
  px(25, 10 + bob, 3, 2, BODY);
  
  px(12, 9 + bob, 2, 4, EYE);
  px(18, 9 + bob, 2, 4, EYE);
  
  px(12, 9 + bob, 1, 1, '#FFFFFF');
  px(18, 9 + bob, 1, 1, '#FFFFFF');
}

function animate(time) {
  drawCrab(time);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
