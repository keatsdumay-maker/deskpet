<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      .body-angry {
        transform-origin: 7.5px 12px;
        animation: body-shake 0.15s infinite alternate ease-in-out;
      }
      .steam1 {
        opacity: 0;
        animation: steam-rise 1.5s infinite ease-out;
      }
      .steam2 {
        opacity: 0;
        animation: steam-rise 1.5s 0.5s infinite ease-out;
      }
      .steam3 {
        opacity: 0;
        animation: steam-rise 1.5s 1s infinite ease-out;
      }
      .vein {
        opacity: 0;
        animation: vein-pop 2s infinite ease-in-out;
      }
      .eyes-angry {
        transform-origin: 7.5px 9px;
        animation: eyes-squint 1s infinite alternate ease-in-out;
      }
      .shadow-angry {
        animation: shadow-shake 0.15s infinite alternate ease-in-out;
      }

      @keyframes body-shake {
        0%   { transform: translateX(-0.5px); }
        100% { transform: translateX(0.5px); }
      }

      @keyframes steam-rise {
        0%   { opacity: 0; transform: translate(0, 0) scale(0.5); }
        20%  { opacity: 0.7; transform: translate(0, -2px) scale(0.8); }
        60%  { opacity: 0.5; transform: translate(1px, -5px) scale(1); }
        100% { opacity: 0; transform: translate(2px, -8px) scale(1.2); }
      }

      @keyframes vein-pop {
        0%, 40%  { opacity: 0; transform: scale(0.5); }
        50%      { opacity: 1; transform: scale(1.1); }
        60%      { opacity: 1; transform: scale(1); }
        90%      { opacity: 1; transform: scale(1); }
        100%     { opacity: 0; transform: scale(0.8); }
      }

      @keyframes eyes-squint {
        0%   { transform: scaleY(0.4); }
        100% { transform: scaleY(0.5); }
      }

      @keyframes shadow-shake {
        0%   { transform: translateX(-0.3px); }
        100% { transform: translateX(0.3px); }
      }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <rect class="shadow-angry" x="3" y="15" width="9" height="1" fill="#000" opacity="0.5"/>

  <!-- Static Legs -->
  <g fill="#DE886D">
    <rect x="3" y="11" width="1" height="4"/>
    <rect x="5" y="11" width="1" height="4"/>
    <rect x="9" y="11" width="1" height="4"/>
    <rect x="11" y="11" width="1" height="4"/>
  </g>

  <!-- Animated Upper Body -->
  <g class="body-angry">
    <!-- Torso -->
    <g fill="#DE886D">
      <rect x="2" y="6" width="11" height="7"/>
    </g>
    <!-- Arms (clenched, slightly raised) -->
    <g fill="#DE886D">
      <rect x="0" y="8" width="2" height="2"/>
      <rect x="13" y="8" width="2" height="2"/>
    </g>
    <!-- Eyes (angry squint) -->
    <g class="eyes-angry" fill="#000">
      <rect x="4" y="8" width="1" height="2"/>
      <rect x="10" y="8" width="1" height="2"/>
    </g>
    <!-- Angry eyebrows -->
    <g fill="#000" opacity="0.7">
      <rect x="3" y="7" width="2" height="1" transform="rotate(10 4 7.5)"/>
      <rect x="10" y="7" width="2" height="1" transform="rotate(-10 11 7.5)"/>
    </g>

    <!-- Steam puffs above head -->
    <g class="steam1" fill="#FFF">
      <rect x="5" y="-2" width="2" height="1"/>
      <rect x="4" y="-3" width="2" height="1"/>
    </g>
    <g class="steam2" fill="#FFF">
      <rect x="8" y="-2" width="2" height="1"/>
      <rect x="9" y="-4" width="2" height="1"/>
    </g>
    <g class="steam3" fill="#FFF">
      <rect x="6" y="-3" width="2" height="1"/>
      <rect x="7" y="-5" width="1" height="1"/>
    </g>

    <!-- Anger vein (cross mark, top-right) -->
    <g class="vein" fill="#E53935" transform="translate(11, -1)">
      <rect x="0" y="1" width="3" height="1"/>
      <rect x="1" y="0" width="1" height="3"/>
    </g>
  </g>
</svg>
