<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      .body-spoiled {
        transform-origin: 7.5px 12px;
        animation: rub-body 1.2s ease-in-out infinite;
      }
      .flower1 { animation: flower-pop 2s 0s infinite ease-out; opacity: 0; }
      .flower2 { animation: flower-pop 2s 0.7s infinite ease-out; opacity: 0; }
      .flower3 { animation: flower-pop 2s 1.4s infinite ease-out; opacity: 0; }
      .eyes-spoiled {
        transform-origin: 7.5px 9px;
        animation: eye-happy 1.2s ease-in-out infinite;
      }
      .cheek { opacity: 0.6; }

      @keyframes rub-body {
        0%, 100% { transform: translateX(0) rotate(0deg); }
        25% { transform: translateX(-2px) rotate(-3deg); }
        75% { transform: translateX(2px) rotate(3deg); }
      }
      @keyframes flower-pop {
        0%   { opacity: 0; transform: translateY(0) scale(0.3); }
        20%  { opacity: 1; transform: translateY(-2px) scale(0.8); }
        50%  { opacity: 0.8; transform: translateY(-4px) scale(1); }        100% { opacity: 0; transform: translateY(-7px) scale(0.5); }
      }

      @keyframes eye-happy {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(0.7); }
      }
    </style>
  </defs>

  <rect x="3" y="15" width="9" height="1" fill="#000" opacity="0.5"/>

  <g fill="#DE886D">
    <rect x="3" y="11" width="1" height="4"/>
    <rect x="5" y="11" width="1" height="4"/>
    <rect x="9" y="11" width="1" height="4"/>
    <rect x="11" y="11" width="1" height="4"/>
  </g>

  <g class="body-spoiled">
    <g fill="#DE886D">
      <rect x="2" y="6" width="11" height="7"/>
    </g>
    <g fill="#DE886D">
      <rect x="0" y="9" width="2" height="2"/>
      <rect x="13" y="9" width="2" height="2"/>
    </g>
    <g class="eyes-spoiled" fill="#111">
      <rect x="4" y="8" width="1" height="2"/>
      <rect x="10" y="8" width="1" height="2"/>
    </g>
    <g class="cheek">
      <rect x="2" y="10" width="2" height="1" fill="#FF9999"/>
      <rect x="11" y="10" width="2" height="1" fill="#FF9999"/>
    </g>
    <g class="flower1" fill="#FFB6C1">
      <rect x="4" y="-3" width="2" height="2"/>
      <rect x="3" y="-2" width="1" height="1"/>
      <rect x="6" y="-2" width="1" height="1"/>
    </g>
    <g class="flower2" fill="#FFD700">
      <rect x="9" y="-2" width="2" height="2"/>
      <rect x="8" y="-1" width="1" height="1"/>
      <rect x="11" y="-1" width="1" height="1"/>
    </g>
    <g class="flower3" fill="#FF69B4">
      <rect x="6" y="-5" width="2" height="2"/>
      <rect x="5" y="-4" width="1" height="1"/>
      <rect x="8" y="-4" width="1" height="1"/>
    </g>
  </g>
</svg>