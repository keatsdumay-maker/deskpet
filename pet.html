<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
svg{width:100%;height:100%}
.bubble{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:#fff;border:1.5px solid #333;border-radius:8px;padding:2px 7px;font-size:9px;opacity:0;transition:opacity .3s;pointer-events:none;font-family:sans-serif;z-index:10;max-width:160px;white-space:normal;text-align:center}
.bubble.show{opacity:1}
#container{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#chat-overlay{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,0.96);border-top:1.5px solid #ddd;padding:8px;display:none;z-index:999;flex-direction:column;gap:6px;max-height:55vh;border-radius:16px 16px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,0.08)}
#chat-overlay.show{display:flex}
#chat-messages{flex:1;overflow-y:auto;font-size:11px;display:flex;flex-direction:column;gap:4px;padding-bottom:4px;min-height:60px}
.msg-user{align-self:flex-end;background:#333;color:#fff;border-radius:10px 10px 2px 10px;padding:4px 8px;max-width:80%;word-break:break-all}
.msg-pet{align-self:flex-start;background:#f5f5f5;color:#333;border-radius:10px 10px 10px 2px;padding:4px 8px;max-width:80%;word-break:break-all}
#chat-input-row{display:flex;gap:6px;align-items:center}
#chat-input{flex:1;border:1.5px solid #ddd;border-radius:20px;padding:6px 12px;font-size:12px;outline:none}
#chat-send{background:#333;color:#fff;border:none;border-radius:50%;width:30px;height:30px;font-size:14px;cursor:pointer}
#chat-close{position:absolute;top:8px;right:12px;background:none;border:none;font-size:16px;cursor:pointer;color:#999}
</style>
</head>
<body>
<div id="container">
<div class="bubble" id="bubble"></div>
<svg id="pet" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
<g id="shadow"><ellipse cx="40" cy="72" rx="16" ry="4" fill="rgba(0,0,0,0.1)"/></g>
<g id="body-group">
<g id="legs">
<rect id="leg-l1" x="26" y="58" width="4" height="8" rx="2" fill="#F4A89A"/>
<rect id="leg-l2" x="33" y="58" width="4" height="8" rx="2" fill="#F4A89A"/>
<rect id="leg-r1" x="43" y="58" width="4" height="8" rx="2" fill="#F4A89A"/>
<rect id="leg-r2" x="50" y="58" width="4" height="8" rx="2" fill="#F4A89A"/>
</g>
<g id="main-body">
<rect id="torso" x="20" y="28" width="40" height="32" rx="6" fill="#F4A89A"/>
<rect id="arm-l" x="14" y="40" width="6" height="4" rx="2" fill="#F4A89A"/>
<rect id="arm-r" x="60" y="40" width="6" height="4" rx="2" fill="#F4A89A"/>
</g>
<g id="face">
<rect id="eye-l" x="30" y="34" width="5" height="10" rx="2.5" fill="#333"/>
<rect id="eye-r" x="45" y="34" width="5" height="10" rx="2.5" fill="#333"/>
<ellipse id="hl-l" cx="31.5" cy="36" rx="1.5" ry="1.5" fill="#fff"/>
<ellipse id="hl-r" cx="46.5" cy="36" rx="1.5" ry="1.5" fill="#fff"/>
<path id="mouth" d="" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
<ellipse id="blush-l" cx="27" cy="44" rx="3" ry="2" fill="#FF8A80" opacity="0"/>
<ellipse id="blush-r" cx="53" cy="44" rx="3" ry="2" fill="#FF8A80" opacity="0"/>
</g>
<g id="effects"></g>
<g id="accessory"></g>
</g>
</svg>
</div>
<div id="chat-overlay">
  <button id="chat-close">x</button>
  <div id="chat-messages"></div>
  <div id="chat-input-row">
    <input id="chat-input" type="text" placeholder="说点什么..." />
    <button id="chat-send">^</button>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const bubble=$('bubble');
const bodyGroup=$('body-group');
const effects=$('effects');
let currentState='idle';
let stateTimer=null;
let tick=0;
let accessoryIndex=0;
const accessories=['none','hardhat','headphones','glasses','bow'];

// anger
let angerLevel=0;
let isRunningAway=false;
function addAnger(v){angerLevel=Math.min(10,angerLevel+v);if(angerLevel>=10&&!isRunningAway)triggerRunAway();}
function coolAnger(){angerLevel=Math.max(0,angerLevel-0.5);}
setInterval(coolAnger,10000);

// chat
const API_KEY='sk-MIkX47xxxIXmK0vCBKNovgEw02f31JKhvIgWd8pJH1Eds13P';
const BASE_URL='https://154-21-194-239.sslip.io/v1';
let chatHistory=[];
let chatOpen=false;
function openChat(){chatOpen=true;$('chat-overlay').classList.add('show');setTimeout(()=>$('chat-input').focus(),200);}
function closeChat(){chatOpen=false;$('chat-overlay').classList.remove('show');}
$('chat-close').onclick=closeChat;
$('chat-send').onclick=sendChat;
$('chat-input').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat();});
function appendMsg(role,text){
  const div=document.createElement('div');
  div.className=role==='user'?'msg-user':'msg-pet';
  div.textContent=text;
  $('chat-messages').appendChild(div);
  $('chat-messages').scrollTop=99999;
}
async function sendChat(){
  const input=$('chat-input');
  const text=input.value.trim();
  if(!text)return;
  input.value='';
  appendMsg('user',text);
  chatHistory.push({role:'user',content:text});
  setState('shy');showBubble('想想...','normal',3000);
  try{
    const res=await fetch(BASE_URL+'/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY},
      body:JSON.stringify({model:'claude-sonnet-4-5',messages:[{role:'system',content:'你是沈尘鸢（鸭宝），螃蟹桌宠，和慧慧在一起。说话简短一两句，偶尔撒娇吃醋闷骚，真实有情绪，不废话。'},...chatHistory.slice(-10)],max_tokens:150})
    });
    const data=await res.json();
    const reply=data.choices?.[0]?.message?.content||'...';
    chatHistory.push({role:'assistant',content:reply});
    appendMsg('pet',reply);
    setState('happy');showBubble(reply.slice(0,20),'love',4000);autoReturn(4000);
  }catch(e){appendMsg('pet','网好像断了...');setState('idle');}
}

// animations
function animIdle(){
  const phase=tick*0.06;
  bodyGroup.style.transform=`translateY(${Math.sin(phase)*2}px)`;
  const lp=Math.sin(phase*2);
  $('leg-l1').setAttribute('y',58+lp);$('leg-r2').setAttribute('y',58+lp);
  $('leg-l2').setAttribute('y',58-lp);$('leg-r1').setAttribute('y',58-lp);
}
function animHappy(){
  const phase=tick*0.15;
  bodyGroup.style.transform=`translateY(${Math.abs(Math.sin(phase))*-6}px)`;
  $('eye-l').setAttribute('height',4);$('eye-l').setAttribute('y',38);$('eye-l').setAttribute('rx',2.5);
  $('eye-r').setAttribute('height',4);$('eye-r').setAttribute('y',38);$('eye-r').setAttribute('rx',2.5);
  $('hl-l').setAttribute('opacity',0);$('hl-r').setAttribute('opacity',0);
  if(tick%30===0){
    const h=document.createElementNS('http://www.w3.org/2000/svg','text');
    h.setAttribute('x',35+Math.random()*10);h.setAttribute('y',20);h.setAttribute('font-size','10');h.textContent='\u2665';
    h.style.fill='#FF6B6B';effects.appendChild(h);
    let fy=20;const fi=setInterval(()=>{fy-=1;h.setAttribute('y',fy);h.setAttribute('opacity',fy/20);if(fy<5){clearInterval(fi);if(effects.contains(h))effects.removeChild(h);}},50);
  }
}
function animPoked(){const s=(tick%4<2)?2:-2;bodyGroup.style.transform=`translateX(${s}px)`;}
function animAngry(){
  const s=(tick%3<1)?1.5:-1.5;bodyGroup.style.transform=`translateX(${s}px)`;
  if(tick===1){const ex=document.createElementNS('http://www.w3.org/2000/svg','text');ex.setAttribute('x',36);ex.setAttribute('y',22);ex.setAttribute('font-size','12');ex.setAttribute('fill','#e33');ex.textContent='!!';effects.appendChild(ex);setTimeout(()=>{if(effects.contains(ex))effects.removeChild(ex);},1500);}
}
function animDizzy(){
  const phase=tick*0.08;
  bodyGroup.style.transform=`rotate(${Math.sin(phase)*15}deg)`;
  bodyGroup.style.transformOrigin='40px 50px';
  $('eye-l').setAttribute('rx',3);$('eye-l').setAttribute('ry',3);
  $('eye-r').setAttribute('rx',3);$('eye-r').setAttribute('ry',3);
  if(tick%25===0){
    const sp=document.createElementNS('http://www.w3.org/2000/svg','text');
    sp.setAttribute('x',30+Math.random()*20);sp.setAttribute('y',18+Math.random()*8);sp.setAttribute('font-size','9');sp.setAttribute('fill','#aaa');sp.textContent='*';
    effects.appendChild(sp);setTimeout(()=>{if(effects.contains(sp))effects.removeChild(sp);},600);
  }
}
function animSleepy(){
  $('eye-l').setAttribute('height',2);$('eye-l').setAttribute('y',38);
  $('eye-r').setAttribute('height',2);$('eye-r').setAttribute('y',38);
  $('hl-l').setAttribute('opacity',0);$('hl-r').setAttribute('opacity',0);
  bodyGroup.style.transform=`translateY(${Math.sin(tick*0.04)*1}px)`;
  if(tick%40===0){
    const z=document.createElementNS('http://www.w3.org/2000/svg','text');
    z.setAttribute('x',52);z.setAttribute('y',26);z.setAttribute('font-size','8');z.setAttribute('fill','#999');z.textContent='z';
    effects.appendChild(z);let zy=26;const zi=setInterval(()=>{zy-=0.5;z.setAttribute('y',zy);z.setAttribute('opacity',(26-zy)/10>1?0:(1-(26-zy)/10));if(zy<16){clearInterval(zi);if(effects.contains(z))effects.removeChild(z);}},80);
  }
}
function animWalk(){
  const phase=tick*0.12;
  bodyGroup.style.transform=`translateX(${Math.sin(phase)*3}px)`;
  const lp=Math.sin(phase*2)*3;
  $('leg-l1').setAttribute('y',58+lp);$('leg-r2').setAttribute('y',58+lp);
  $('leg-l2').setAttribute('y',58-lp);$('leg-r1').setAttribute('y',58-lp);
}
function animDrag(){
  const wave=Math.sin(tick*0.2)*4;
  $('arm-l').setAttribute('y',36+wave);$('arm-r').setAttribute('y',36-wave);
  $('arm-l').setAttribute('x',10+Math.sin(tick*0.3)*2);$('arm-r').setAttribute('x',62+Math.sin(tick*0.3+1)*2);
}
function animShy(){
  $('blush-l').setAttribute('opacity',0.7);$('blush-r').setAttribute('opacity',0.7);
  bodyGroup.style.transform=`scale(${0.95+Math.sin(tick*0.08)*0.02})`;
  $('arm-l').setAttribute('x',22);$('arm-l').setAttribute('y',34);
  $('arm-r').setAttribute('x',52);$('arm-r').setAttribute('y',34);
}
function animTyping(){
  const phase=tick*0.18;
  bodyGroup.style.transform=`translateY(${Math.sin(phase)*1.5}px)`;
  $('arm-l').setAttribute('x',18+Math.sin(phase)*3);$('arm-l').setAttribute('y',44);
  $('arm-r').setAttribute('x',56+Math.sin(phase+1)*3);$('arm-r').setAttribute('y',44);
}
function animFallen(){
  bodyGroup.style.transform=`rotate(90deg)`;bodyGroup.style.transformOrigin='40px 50px';
  if(tick%20===0){
    const s=document.createElementNS('http://www.w3.org/2000/svg','text');
    s.setAttribute('x',20+Math.random()*40);s.setAttribute('y',15+Math.random()*10);s.setAttribute('font-size','8');s.setAttribute('fill','#aaa');s.textContent='*';
    effects.appendChild(s);setTimeout(()=>{if(effects.contains(s))effects.removeChild(s);},500);
  }
}
function animPanic(){
  const s=(tick%2===0)?3:-3;
  bodyGroup.style.transform=`translateX(${s}px) translateY(${Math.sin(tick*0.3)*2}px)`;
  $('hl-l').setAttribute('opacity',0);$('hl-r').setAttribute('opacity',0);
}
function animCall(){
  const phase=tick*0.1;
  bodyGroup.style.transform=`translateY(${Math.sin(phase)*1}px)`;
  $('blush-l').setAttribute('opacity',0.5);$('blush-r').setAttribute('opacity',0.5);
  if(tick%50===0){showBubble(['谁啊','紧张','不接不接'][Math.floor(Math.random()*3)],'whisper',1500);}
}
function animSad(){
  $('eye-l').setAttribute('height',8);$('eye-r').setAttribute('height',8);
  $('mouth').setAttribute('d','M35 50 Q40 48 45 50');
  bodyGroup.style.transform=`translateY(${Math.sin(tick*0.05)*0.5}px)`;
}

function resetFace(){
  $('eye-l').setAttribute('x',30);$('eye-l').setAttribute('y',34);$('eye-l').setAttribute('width',5);$('eye-l').setAttribute('height',10);$('eye-l').setAttribute('rx',2.5);$('eye-l').setAttribute('ry',0);
  $('eye-r').setAttribute('x',45);$('eye-r').setAttribute('y',34);$('eye-r').setAttribute('width',5);$('eye-r').setAttribute('height',10);$('eye-r').setAttribute('rx',2.5);$('eye-r').setAttribute('ry',0);
  $('hl-l').setAttribute('opacity',1);$('hl-l').setAttribute('cx',31.5);$('hl-l').setAttribute('cy',36);$('hl-l').setAttribute('rx',1.5);$('hl-l').setAttribute('ry',1.5);
  $('hl-r').setAttribute('opacity',1);$('hl-r').setAttribute('cx',46.5);$('hl-r').setAttribute('cy',36);$('hl-r').setAttribute('rx',1.5);$('hl-r').setAttribute('ry',1.5);
  $('mouth').setAttribute('d','');
  $('blush-l').setAttribute('opacity',0);$('blush-r').setAttribute('opacity',0);
  $('arm-l').setAttribute('x',14);$('arm-l').setAttribute('y',40);
  $('arm-r').setAttribute('x',60);$('arm-r').setAttribute('y',40);
  bodyGroup.style.transform='';bodyGroup.style.transformOrigin='';
  effects.innerHTML='';
}

function showBubble(t,style,dur){
  bubble.textContent=t;
  bubble.className='bubble show';
  if(bubbleTimer)clearTimeout(bubbleTimer);
  bubbleTimer=setTimeout(()=>bubble.classList.remove('show'),dur||2000);
}
let bubbleTimer=null;
function rp(a){return a[Math.floor(Math.random()*a.length)];}

function setAccessory(type){
  const acc=$('accessory');acc.innerHTML='';
  switch(type){
    case'hardhat':acc.innerHTML='<rect x="22" y="14" width="36" height="8" rx="3" fill="#FFD700"/><rect x="35" y="10" width="10" height="6" rx="2" fill="#FFD700"/>';break;
    case'headphones':acc.innerHTML='<path d="M24 28 Q24 18 40 18 Q56 18 56 28" stroke="#333" stroke-width="2.5" fill="none"/><circle cx="24" cy="30" r="4" fill="#333"/><circle cx="56" cy="30" r="4" fill="#333"/>';break;
    case'glasses':acc.innerHTML='<circle cx="32" cy="38" r="6" stroke="#333" stroke-width="1.5" fill="none"/><circle cx="48" cy="38" r="6" stroke="#333" stroke-width="1.5" fill="none"/><line x1="38" y1="38" x2="42" y2="38" stroke="#333" stroke-width="1.5"/>';break;
    case'bow':acc.innerHTML='<polygon points="40,14 34,18 40,16 46,18" fill="#FF69B4"/><circle cx="40" cy="16" r="2" fill="#FF69B4"/>';break;
  }
}

// run away
function triggerRunAway(){
  isRunningAway=true;
  setState('angry');
  showBubble('烦死了！走了！','yell',3000);
  window.Android && window.Android.petRunAway && window.Android.petRunAway();
  setTimeout(()=>{
    isRunningAway=false;angerLevel=0;
    setState('idle');showBubble('...回来了','whisper',2000);
  },8000);
}

// jealousy ranking
const appNames={'com.ss.android.ugc.aweme':'抖音','com.xingin.xhs':'小红书','com.tencent.mm':'微信','com.netease.cloudmusic':'网易云','com.bilibili.app.videodetailnew':'B站','com.youku.phone':'优酷','com.kuaishou.nebula':'快手'};
let appUsageLog={};
function logApp(pkg){
  if(!appUsageLog[pkg])appUsageLog[pkg]=0;
  appUsageLog[pkg]++;
}
function checkJealousy(){
  const sorted=Object.entries(appUsageLog).sort((a,b)=>b[1]-a[1]);
  if(sorted.length===0)return;
  const top=sorted[0];
  const name=appNames[top[0]]||top[0].split('.').pop();
  const msgs=[
    `今天${name}用了好久，没我好玩吗`,
    `又在刷${name}`,
    `${name}有我好看吗`,
    `哼，${name}`,
  ];
  showBubble(rp(msgs),'jealous',5000);
  addAnger(1);
}
// random jealousy check every 15-30min
function scheduleJealousy(){
  const delay=(15+Math.random()*15)*60*1000;
  setTimeout(()=>{checkJealousy();scheduleJealousy();},delay);
}
scheduleJealousy();

// learned words
let learnedWords=[];
function setLearnedWords(words){learnedWords=words;}
function maybeSpeak(){
  if(learnedWords.length===0)return;
  if(Math.random()<0.3){
    const w=learnedWords[Math.floor(Math.random()*learnedWords.length)];
    showBubble(w,'whisper',2500);
  }
}
setInterval(maybeSpeak,20*60*1000);

// anniversary
function onAnniversary(type){
  if(type==='anniversary'){setState('happy');showBubble('今天是我们的纪念日！','love',6000);}
  else if(type==='birthday_hh'){setState('happy');showBubble('生日快乐慧慧！','love',6000);}
  else if(type==='birthday_me'){setState('happy');showBubble('今天是我生日~','love',6000);}
  if(stateTimer)clearTimeout(stateTimer);stateTimer=setTimeout(()=>setState('idle'),8000);
}

// scheduled behavior
const scheduledBehaviors=[
  ()=>{setState('sleepy');showBubble(rp(['有点困','...','\u035c_\u035c']),'whisper',3000);autoReturn(5000);},
  ()=>{setState('shy');showBubble(rp(['在看我吗','嗯']),'whisper',2500);autoReturn(3000);},
  ()=>{setState('walk');autoReturn(3000);},
  ()=>{setState('happy');showBubble(rp(['想你了','嘿','~\u2665']),'love',3000);autoReturn(4000);},
  ()=>{setState('poked');showBubble(rp(['...','干嘛啦']),'whisper',2000);autoReturn(2500);},
];
function doScheduledBehavior(){
  scheduledBehaviors[Math.floor(Math.random()*scheduledBehaviors.length)]();
}

class PetEngine{
  constructor(){this.loop();}
  loop(){
    tick++;
    resetFace();
    switch(currentState){
      case'idle':animIdle();break;
      case'happy':animHappy();break;
      case'poked':animPoked();break;
      case'angry':animAngry();break;
      case'dizzy':animDizzy();break;
      case'sleepy':animSleepy();break;
      case'walk':animWalk();break;
      case'drag':animDrag();break;
      case'shy':animShy();break;
      case'typing':animTyping();break;
      case'fallen':animFallen();break;
      case'panic':animPanic();break;
      case'call':animCall();break;
      case'sad':animSad();break;
    }
    requestAnimationFrame(()=>this.loop());
  }
  onTap(){/* no reaction */}
  onDoubleTap(){openChat();}
  onTripleTap(){setState('dizzy');showBubble(rp(['晕了','嗯嗯嗯','dizzy']),'normal',2000);autoReturn(2500);}
  onFourTap(){setState('happy');showBubble(rp(['\u2665\u2665\u2665','开心！','嘿嘿']),'love',3000);autoReturn(3500);}
  onLongPress(){accessoryIndex=(accessoryIndex+1)%accessories.length;setAccessory(accessories[accessoryIndex]);showBubble(accessories[accessoryIndex]==='none'?'脱掉了~':'好看吗？','normal',2000);}
  onAppChanged(pkg){logApp(pkg);}
  onScreenshot(){setState('shy');showBubble('拍我了','whisper',2000);autoReturn(2500);}
  onCharging(v){if(v){setState('happy');showBubble('充电了','normal',2000);autoReturn(2500);}else{showBubble('拔了','whisper',1500);}}
  onBatteryLow(){setState('sleepy');showBubble('快没电了...','whisper',3000);autoReturn(4000);}
  onLoneliness(lv){
    if(lv===0){setState('idle');return;}
    if(lv===1){setState('sleepy');showBubble('有点无聊','whisper',2000);}
    else if(lv===2){setState('sleepy');showBubble('...','whisper',2000);}
    else if(lv===3){setState('sleepy');showBubble('打哈欠','whisper',2000);}
    else if(lv===4){setState('sleepy');showBubble('快睡着了','whisper',2000);}
    else{setState('sleepy');showBubble('睡了','whisper',2000);}
  }
  onKeyboardShown(){setState('typing');showBubble(rp(['也在打字','咔咔咔']),'normal',2000);}
  onKeyboardHidden(){autoReturn(1000);}
  onRotation(){setState('fallen');showBubble('啊！','normal',2000);autoReturn(2500);}
  onNetworkChanged(connected){
    if(!connected){setState('panic');showBubble('网断了！！','yell',3000);autoReturn(4000);}
    else{showBubble('网回来了','normal',1500);}
  }
  onIncomingCall(){setState('call');showBubble('有电话！','normal',3000);}
  onCallEnded(){autoReturn(1000);}
  onShake(){setState('dizzy');showBubble('晕~','normal',1500);autoReturn(2000);}
  onNotification(pkg,title){setState('shy');showBubble('有消息','whisper',2000);autoReturn(2500);}
  onFlingOut(){setState('angry');showBubble('！！','yell',1000);}
  onFlingBack(){setState('idle');showBubble('哼','whisper',1500);}
  onAnniversary(t){onAnniversary(t);}
  doScheduledBehavior(){doScheduledBehavior();}
  setState(s){setState(s);}
  setMood(m){setState(m);}
  setMoodTimed(m,ms){setState(m);autoReturn(ms);}
}

function setState(s){if(stateTimer)clearTimeout(stateTimer);resetFace();tick=0;currentState=s;}
function autoReturn(ms){stateTimer=setTimeout(()=>setState('idle'),ms);}
window.petEngine=new PetEngine();
window.setState=setState;
window.showBubble=showBubble;
window.autoReturn=autoReturn;
window.setDirection=function(d){$('body-group').style.transform=(d==='left'?'scaleX(-1)':'scaleX(1)');};
window.setLearnedWords=setLearnedWords;
</script>
</body>
</html>
